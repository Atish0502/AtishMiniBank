<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiniBank — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
      <rect x="2" y="6" width="20" height="12" rx="2" fill="#0ff3c3" opacity="0.12"/>
      <path d="M4 10h16M4 14h10" stroke="#6ee7b7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg><span>MiniBank</span></div>
    <nav class="nav">
      <button data-target="dashboard" class="nav-btn active">Dashboard</button>
      <button data-target="accounts" class="nav-btn">Accounts</button>
      <button data-target="transactions" class="nav-btn">Transactions</button>
    </nav>
  </header>

  <main class="container">
    <section id="dashboard" class="panel">
      <h2>Quick Actions</h2>
      <div class="grid">
        <div class="card">
          <h3>Create Account</h3>
          <form id="createForm">
            <input name="name" placeholder="Full name" required />
            <input name="accountNumber" placeholder="Account number" required />
            <button type="submit">Create</button>
          </form>
          <div class="result" id="createResult"></div>
        </div>

        <div class="card">
          <h3>Deposit</h3>
          <form id="depositForm">
            <input name="accountNumber" placeholder="Account number" required />
            <input name="amount" type="number" placeholder="Amount" required />
            <button type="submit">Deposit</button>
          </form>
          <div class="result" id="depositResult"></div>
        </div>

        <div class="card">
          <h3>Withdraw</h3>
          <form id="withdrawForm">
            <input name="accountNumber" placeholder="Account number" required />
            <input name="amount" type="number" placeholder="Amount" required />
            <button type="submit">Withdraw</button>
          </form>
          <div class="result" id="withdrawResult"></div>
        </div>

        <div class="card">
          <h3>Transfer</h3>
          <form id="transferForm">
            <input name="from" placeholder="From account" required />
            <input name="to" placeholder="To account" required />
            <input name="amount" type="number" placeholder="Amount" required />
            <button type="submit">Send</button>
          </form>
          <div class="result" id="transferResult"></div>
        </div>

        <div class="card large">
          <h3>Check Balance</h3>
          <form id="balanceForm" class="inline">
            <input name="accountNumber" placeholder="Account number" required />
            <button type="submit">Lookup</button>
          </form>
          <div class="result" id="balanceResult"></div>
        </div>
      </div>
    </section>

    <section id="accounts" class="panel hidden">
      <h2>Account Lookup</h2>
      <p>Lookup any account balance quickly.</p>
      <form id="accountsLookup">
        <input name="accountNumber" placeholder="Account number" required />
        <button type="submit">Lookup</button>
      </form>
      <div class="result" id="accountsResult"></div>
    </section>

    <section id="transactions" class="panel hidden">
      <h2>Transactions</h2>
      <div id="txList" class="tx-list">Loading transactions...</div>
    </section>
  </main>

  <footer class="footer">MiniBank demo — Local only</footer>

  <script src="/app.js"></script>
</body>
</html>
